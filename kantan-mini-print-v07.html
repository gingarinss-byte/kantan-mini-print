<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>かんたんミニ印刷 0.7</title><style>body{font-family:system-ui,sans-serif;background:#f4f6f8;color:#17212b;margin:0}main{max-width:620px;margin:auto;padding:18px}section{background:white;border-radius:16px;padding:18px;margin:16px 0;box-shadow:0 2px 9px #0001}h1{font-size:1.5rem}h2{font-size:1.15rem}label{display:block;font-weight:650;margin:16px 0 7px}textarea,select,input[type=range]{width:100%;box-sizing:border-box}textarea,select{font-size:18px;padding:12px;border:1px solid #adb8c2;border-radius:9px}button,.link{display:inline-block;background:#0877cd;color:white;border:0;border-radius:10px;padding:13px 16px;font-size:16px;margin:10px 7px 4px 0;text-decoration:none}button:disabled{background:#9aabb9}canvas{width:100%;max-width:384px;border:1px dashed #adb8c2;image-rendering:auto}small{color:#516170}#status{white-space:pre-wrap;background:#edf3f8;padding:12px;border-radius:9px} .warn{color:#6b4b13}</style></head><body><main><h1>🖨️ かんたんミニ印刷</h1><p><strong>試作版 0.7</strong> — 日本語フォント・大きな文字・印刷用画像</p><section><label for="words">印刷したい文字</label><textarea id="words" rows="4">テスト印刷</textarea><label for="font">フォント</label><select id="font"><option value="sans-serif">ゴシック体</option><option value="serif">明朝体</option><option value="'Arial Rounded MT Bold','Hiragino Maru Gothic ProN',sans-serif">丸ゴシック風（端末依存）</option><option value="monospace">等幅文字</option></select><label for="size">文字サイズ：<output id="sizeValue">48</output> px</label><input id="size" type="range" min="12" max="100" value="48"><label for="align">文字の位置</label><select id="align"><option value="left">左</option><option value="center">中央</option><option value="right">右</option></select></section><section><h2>印刷プレビュー（384ドット幅）</h2><canvas id="preview" aria-label="印刷画像のプレビュー"></canvas><p><small>白黒の印刷画像を作ります。フォントはスマホ内で利用できるものを使います。</small></p><button id="save" type="button">印刷画像を保存（PNG）</button><div id="status" role="status">準備中…</div></section><section><h2>🖨️ X6 mini に直接印刷</h2><p>ChromeからX6h-A764に直接送信します。プリンターの電源を入れてください。</p><button id="connect" type="button">① Bluetooth接続</button><button id="print" type="button" disabled>② この画像を印刷</button><p id="bleStatus" role="status" aria-live="polite">未接続</p><p><small>試作版です。印刷中は画面を閉じず、紙が出終わるまで待ってください。うまくいかない場合はVer.0.6を利用できます。</small></p><p><small>通信方式の参考：<a href="https://github.com/cicloid/printable" target="_blank" rel="noopener">cicloid/printable（MIT License）</a>。通信仕様を参考に独自実装しています。</small></p></section></main><script>
const $=id=>document.getElementById(id),c=$('preview'),ctx=c.getContext('2d',{willReadFrequently:true});let scheduled=false;function render(){scheduled=false;const size=+$('size').value,w=384,pad=12,lh=Math.ceil(size*1.35),family=$('font').value; $('sizeValue').textContent=size;ctx.font=`${size}px ${family}`;const maxW=w-pad*2;let lines=[];for(const paragraph of $('words').value.split('\n')){let line='';for(const char of [...paragraph]){if(line&&ctx.measureText(line+char).width>maxW){lines.push(line);line=char}else line+=char}lines.push(line)}const h=Math.max(64,Math.min(6000,pad*2+lines.length*lh));c.width=w;c.height=h;ctx.fillStyle='white';ctx.fillRect(0,0,w,h);ctx.fillStyle='black';ctx.font=`${size}px ${family}`;ctx.textBaseline='top';ctx.textAlign=$('align').value;const x=$('align').value==='center'?w/2:$('align').value==='right'?w-pad:pad;lines.forEach((line,i)=>{const y=pad+i*lh;if(y<h)ctx.fillText(line,x,y)});const im=ctx.getImageData(0,0,w,h);for(let i=0;i<im.data.length;i+=4){const v=im.data[i]*.299+im.data[i+1]*.587+im.data[i+2]*.114<170?0:255;im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=255}ctx.putImageData(im,0,0);$('status').textContent=`画像準備完了：${w} × ${h} ドット（${lines.length}行）`}
function schedule(){if(!scheduled){scheduled=true;requestAnimationFrame(render)}}['words','font','size','align'].forEach(id=>$(id).addEventListener('input',schedule));$('save').addEventListener('click',()=>{render();const a=document.createElement('a');a.href=c.toDataURL('image/png');a.download='kantan-mini-print-v07.png';a.click();$('status').textContent+='\nPNG画像を保存しました。'});render();

// X6/X6h Web Bluetooth direct print, based on published X6 protocol specification.
let bleDevice=null, bleWrite=null, bleNotify=null, bufferFull=false, busy=false;
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
function bleMsg(msg){$('bleStatus').textContent=msg}
function crc8(bytes){let c=0;for(const b of bytes){c^=b;for(let i=0;i<8;i++)c=((c&128)?((c<<1)^7):(c<<1))&255}return c}
function frame(cmd,payload){const p=Uint8Array.from(payload);const out=new Uint8Array(8+p.length);out.set([0x51,0x78,cmd,0,p.length&255,(p.length>>8)&255],0);out.set(p,6);out[6+p.length]=crc8(p);out[7+p.length]=255;return out}
function reverseBits(b){b=((b&0xf0)>>4)|((b&0x0f)<<4);b=((b&0xcc)>>2)|((b&0x33)<<2);return ((b&0xaa)>>1)|((b&0x55)<<1)}
async function writeFrame(cmd,payload){if(!bleWrite)throw Error('Bluetoothが未接続です');const data=frame(cmd,payload);if(bleWrite.writeValueWithoutResponse)await bleWrite.writeValueWithoutResponse(data);else await bleWrite.writeValue(data)}
$('connect').addEventListener('click',async()=>{
 if(busy)return;
 if(!navigator.bluetooth){bleMsg('この画面ではBluetoothを使えません。GitHub PagesをChromeで開いてください。');return}
 try{
  bleMsg('プリンターを探しています…');
  const dev=await navigator.bluetooth.requestDevice({filters:[{namePrefix:'X6h-'},{namePrefix:'x6h-'},{services:[0xae30]},{services:[0xaf30]}],optionalServices:[0xae30]});
  const server=await dev.gatt.connect();const svc=await server.getPrimaryService(0xae30);
  const wr=await svc.getCharacteristic(0xae01),nt=await svc.getCharacteristic(0xae02);
  await nt.startNotifications();
  nt.addEventListener('characteristicvaluechanged',ev=>{const v=new Uint8Array(ev.target.value.buffer,ev.target.value.byteOffset,ev.target.value.byteLength);if(v.length>=9&&v[0]===0x51&&v[1]===0x78&&v[2]===0xae&&v[3]===1&&v[4]===1&&v[5]===0){if(v[6]===0x10)bufferFull=true;else if(v[6]===0)bufferFull=false}});
  dev.addEventListener('gattserverdisconnected',()=>{bleWrite=null;bleNotify=null;$('print').disabled=true;bleMsg('切断されました。再接続してください。')});
  bleDevice=dev;bleWrite=wr;bleNotify=nt;$('print').disabled=false;bleMsg('接続：'+dev.name+'（印刷できます）');
 }catch(e){bleMsg('接続できませんでした：'+e.message)}
});
$('print').addEventListener('click',async()=>{
 if(busy||!bleWrite)return;
 busy=true;$('print').disabled=true;$('connect').disabled=true;
 try{
  render();const w=c.width,h=c.height;if(w!==384||h>1500)throw Error('画像が長すぎます。文字を短くしてください。');
  const rgba=ctx.getImageData(0,0,w,h).data;
  const density=3,energy=12000+6000*(density-1),speed=8+4*(density-1);
  bufferFull=false;bleMsg('印刷の準備中…');
  await writeFrame(0xbd,[speed]);await writeFrame(0xaf,[energy&255,energy>>8]);await writeFrame(0xbe,[1]);
  await writeFrame(0xa2,new Uint8Array(48));
  for(let y=0;y<h;y++){
   let waited=0;while(bufferFull){await wait(100);waited+=100;if(waited>15000)throw Error('プリンターの応答待ちが長すぎます')}
   const row=new Uint8Array(48);
   for(let x=0;x<384;x++)if(rgba[(y*384+x)*4]<128)row[x>>3]|=1<<(x&7);
   await writeFrame(0xa2,row);
   if(y%20===0)bleMsg('印刷データ送信中… '+Math.round((y+1)/h*100)+'%');
   await wait(15);
  }
  await writeFrame(0xa1,[40,0]);bleMsg('データ送信完了。紙が出終わるまで5秒待っています…');await wait(5000);
  bleMsg('送信が終わりました。紙の印刷結果を確認してください。');
 }catch(e){bleMsg('印刷エラー：'+e.message+'　必要なら再接続してください。')}
 finally{busy=false;$('connect').disabled=false;$('print').disabled=!bleWrite}
});
</script></body></html>
