<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>かんたんミニ印刷 0.2</title>
<style>body{font-family:system-ui,sans-serif;background:#f4f6f8;color:#17212b;margin:0}main{max-width:600px;margin:auto;padding:20px}h1{font-size:1.5rem}section{background:white;border-radius:16px;padding:16px;margin:14px 0;box-shadow:0 2px 9px #0001}label{display:block;font-weight:600;margin:12px 0 5px}textarea,select,input[type=range]{width:100%;box-sizing:border-box}textarea,select{font-size:17px;padding:10px;border:1px solid #aeb9c4;border-radius:9px}button{background:#0877cd;color:white;border:0;border-radius:10px;padding:13px 18px;font-size:16px;margin:8px 6px 0 0}button:disabled{background:#9aabb9}#paper{width:288px;max-width:100%;min-height:130px;border:1px dashed #adb8c2;padding:12px;box-sizing:border-box;white-space:pre-wrap;overflow-wrap:anywhere;background:#fff;color:#000;line-height:1.4}small{color:#4b5968}#status{white-space:pre-wrap;overflow-wrap:anywhere;background:#eef3f7;padding:12px;border-radius:8px;font-size:14px}.note{color:#5c4a14}#details{white-space:pre-wrap;overflow-wrap:anywhere;background:#f6f8fb;padding:12px;border-radius:8px;font-size:12px}</style></head>
<body><main><h1>🖨️ かんたんミニ印刷</h1><p><strong>試作版 0.2</strong> — Bluetooth通信情報の調査用</p><section><label for="words">印刷したい文字</label><textarea id="words" rows="4">テスト印刷</textarea><label for="font">フォント</label><select id="font"><option value="sans-serif">ゴシック体</option><option value="serif">明朝体</option><option value="'Arial Rounded MT Bold','Hiragino Maru Gothic ProN',sans-serif">丸ゴシック風（端末依存）</option><option value="monospace">等幅文字</option></select><label for="size">文字サイズ：<output id="sizeValue">24</output> px</label><input id="size" type="range" min="12" max="64" value="24"><label for="align">文字の位置</label><select id="align"><option value="left">左</option><option value="center">中央</option><option value="right">右</option></select></section><section><h2>プレビュー</h2><div id="paper"></div><small>画面上の見本です。実際の印刷結果とは異なる場合があります。</small></section><section><h2>Bluetooth通信調査</h2><p>プリンターの電源を入れ、Tiny Printを閉じてから接続してください。</p><button id="connect">X6を探して接続</button><button id="scan" disabled>通信情報を調べる</button><div id="status" role="status" aria-live="polite">未接続</div><h3>調査結果</h3><div id="details">まだ調査していません。</div><button id="copy" type="button">調査結果をコピー</button><p class="note">安全のため、この版ではプリンターへの書き込み・印刷データ送信は行いません。Web Bluetoothの権限により一部のサービスしか表示できない場合があります。</p></section><small>Android版Google Chromeで、GitHub PagesのHTTPSページから開いてください。</small></main>
<script>
const $=id=>document.getElementById(id);const update=()=>{$('paper').textContent=$('words').value;$('paper').style.fontFamily=$('font').value;$('paper').style.fontSize=$('size').value+'px';$('paper').style.textAlign=$('align').value;$('sizeValue').textContent=$('size').value};['words','font','size','align'].forEach(id=>$(id).addEventListener('input',update));update();
let device,server;const status=s=>$('status').textContent=s;const report=s=>$('details').textContent=s;
// Only known candidate services can be requested; other services may be inaccessible.
const candidateServices=['0000ff00-0000-1000-8000-00805f9b34fb','0000ffe0-0000-1000-8000-00805f9b34fb','0000fff0-0000-1000-8000-00805f9b34fb','0000ae30-0000-1000-8000-00805f9b34fb','0000af30-0000-1000-8000-00805f9b34fb','0000abf0-0000-1000-8000-00805f9b34fb','0000180a-0000-1000-8000-00805f9b34fb'];
$('connect').addEventListener('click',async()=>{if(!navigator.bluetooth){status('Web Bluetoothを利用できません。Android版ChromeでHTTPSページを開いてください。');return}try{$('scan').disabled=true;status('Bluetooth機器を選択してください…');device=await navigator.bluetooth.requestDevice({filters:[{namePrefix:'X6'}],optionalServices:candidateServices});device.addEventListener('gattserverdisconnected',()=>{status('切断されました：'+device.name);$('scan').disabled=true});status('接続しています…');server=await device.gatt.connect();status('接続成功：'+device.name+'\nGATT接続状態：'+server.connected);$('scan').disabled=false;report('「通信情報を調べる」を押してください。')}catch(e){status('接続できませんでした：'+(e.message||e))}});
$('scan').addEventListener('click',async()=>{if(!server?.connected){status('先に接続してください。');return}const lines=['機器名: '+(device.name||'不明'),'接続: '+server.connected,'候補サービスの確認結果:'];$('scan').disabled=true;for(const uuid of candidateServices){try{const service=await server.getPrimaryService(uuid);lines.push('\nサービス: '+service.uuid);try{const chars=await service.getCharacteristics();if(chars.length===0)lines.push('  キャラクタリスティックなし');for(const ch of chars){const p=ch.properties;lines.push('  特性: '+ch.uuid+'\n    read='+p.read+' write='+p.write+' writeWithoutResponse='+p.writeWithoutResponse+' notify='+p.notify)}}catch(e){lines.push('  特性を取得できません: '+e.message)}}catch(e){lines.push('未検出またはアクセス不可: '+uuid)}}lines.push('\n※ 候補に含まれないサービスは確認できません。');report(lines.join('\n'));$('scan').disabled=false;status('通信情報の確認が終了しました。印刷データは送信していません。')});
$('copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText($('details').textContent);status('調査結果をコピーしました。')}catch(e){status('コピーできませんでした。調査結果をスクリーンショットで送ってください。')}});
</script></body></html>
