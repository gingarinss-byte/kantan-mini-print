<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>かんたんミニ印刷・試作版</title><style>body{font-family:system-ui,sans-serif;background:#f4f6f8;color:#17212b;margin:0}main{max-width:600px;margin:auto;padding:20px}h1{font-size:1.5rem}section{background:white;border-radius:16px;padding:16px;margin:14px 0;box-shadow:0 2px 9px #0001}label{display:block;font-weight:600;margin:12px 0 5px}textarea,select,input[type=range]{width:100%;box-sizing:border-box}textarea,select{font-size:17px;padding:10px;border:1px solid #aeb9c4;border-radius:9px}button{background:#0877cd;color:white;border:0;border-radius:10px;padding:13px 18px;font-size:16px;margin-top:12px}button:disabled{background:#9aabb9}#paper{width:288px;max-width:100%;min-height:130px;border:1px dashed #adb8c2;padding:12px;box-sizing:border-box;white-space:pre-wrap;overflow-wrap:anywhere;background:#fff;color:#000;line-height:1.4}small{color:#4b5968}#status{white-space:pre-wrap;overflow-wrap:anywhere;background:#eef3f7;padding:12px;border-radius:8px;font-size:14px} .note{color:#5c4a14}</style></head><body><main><h1>🖨️ かんたんミニ印刷</h1><p>試作版 0.1 — 文字編集とBluetooth接続の確認用</p><section><label for="words">印刷したい文字</label><textarea id="words" rows="4">テスト印刷</textarea><label for="font">フォント</label><select id="font"><option value="sans-serif">ゴシック体</option><option value="serif">明朝体</option><option value="'Arial Rounded MT Bold','Hiragino Maru Gothic ProN',sans-serif">丸ゴシック風（端末依存）</option><option value="monospace">等幅文字</option></select><label for="size">文字サイズ：<output id="sizeValue">24</output> px</label><input id="size" type="range" min="12" max="64" value="24"><label for="align">文字の位置</label><select id="align"><option value="left">左</option><option value="center">中央</option><option value="right">右</option></select></section><section><h2>プレビュー</h2><div id="paper"></div><small>画面上の見本です。実際の印刷結果とは異なる場合があります。</small></section><section><h2>Bluetooth接続テスト</h2><p>プリンターの電源を入れ、Tiny Printを閉じてから押してください。</p><button id="connect">X6を探して接続</button><div id="status" role="status" aria-live="polite">未接続</div><p class="note">この試作版では印刷データは送信しません。接続とサービス情報の確認だけを行います。</p></section><small>Bluetooth機能はAndroid版Chromeなどの対応ブラウザで、HTTPS公開したページから利用してください。端末に直接保存したHTMLでは利用できないことがあります。</small></main><script>
const $=id=>document.getElementById(id);const update=()=>{$('paper').textContent=$('words').value;$('paper').style.fontFamily=$('font').value;$('paper').style.fontSize=$('size').value+'px';$('paper').style.textAlign=$('align').value;$('sizeValue').textContent=$('size').value};['words','font','size','align'].forEach(id=>$(id).addEventListener('input',update));update();let device;const status=s=>$('status').textContent=s;$('connect').addEventListener('click',async()=>{if(!navigator.bluetooth){status('このブラウザではWeb Bluetoothを利用できません。Android版ChromeでHTTPSページを開いてください。');return}try{status('Bluetooth機器を選択してください…');device=await navigator.bluetooth.requestDevice({filters:[{namePrefix:'X6'}],optionalServices:[]});device.addEventListener('gattserverdisconnected',()=>status('切断されました：'+device.name));status('選択済み：'+device.name+'\n接続しています…');const server=await device.gatt.connect();status('接続成功：'+device.name+'\nGATT接続状態：'+server.connected+'\n印刷機能はまだ未実装です。\n通信サービスの調査が必要です。')}catch(e){status('接続できませんでした：'+(e.message||e))}});
</script></body></html>
